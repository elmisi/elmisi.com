<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Where to Look, Not What to Change — ASCII cover</title>
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/fonts/JetBrainsMono-Regular.woff2") format("woff2");
        font-display: swap;
      }

      :root { color-scheme: dark; }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        background: #0a0e14;
      }

      figure {
        display: grid;
        width: 100vw;
        margin: 0;
        place-items: center;
      }

      pre {
        margin: 0;
        font-family: "JetBrains Mono", monospace;
        font-size: clamp(3px, 0.88vw, 13px);
        font-variant-ligatures: none;
        font-weight: 400;
        letter-spacing: 0;
        line-height: 0.88;
        text-shadow:
          0 0 0.35em currentColor,
          0 0 0.9em rgb(57 211 83 / 35%);
        user-select: text;
      }

      .p0 { color: #0a0e14; }
      .p1 { color: #123f21; }
      .p2 { color: #197a32; }
      .p3 { color: #22ad42; }
      .p4 { color: #32d457; }
      .p5 { color: #52e875; }
      .p6 { color: #9af6ae; }
      .p7 { color: #f0fff2; }

      figcaption {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
